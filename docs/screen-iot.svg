  <text x="256" y="283" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="end">15</text>
  <text x="256" y="303" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="end">10</text>
  <text x="256" y="323" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="end">5</text>
  <text x="256" y="343" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="end">0</text>
  <text x="256" y="363" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="end">-5</text>

  <!-- Safe zone band -->
  <rect x="268" y="300" width="600" height="40" fill="#22c55e" opacity="0.06"/>
  <line x1="268" y1="300" x2="868" y2="300" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <line x1="268" y1="340" x2="868" y2="340" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <text x="874" y="312" font-family="sans-serif" font-size="7" fill="#22c55e">8°C</text>
  <text x="874" y="344" font-family="sans-serif" font-size="7" fill="#22c55e">2°C</text>

  <!-- Temperature line (normal then spike) -->
  <polyline points="268,322 298,318 328,320 358,316 388,319 418,315 448,318 478,314 508,316 538,312 568,308 598,300 628,288 658,272 688,264 718,260 748,262 778,268 808,272 838,270 868,268"
    fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Violation marker -->
  <circle cx="598" cy="300" r="5" fill="#ef4444"/>
  <line x1="598" y1="260" x2="598" y2="300" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="560" y="248" width="76" height="16" rx="4" fill="#fef2f2"/>
  <text x="598" y="259" font-family="sans-serif" font-size="8" fill="#dc2626" text-anchor="middle">VIOLATION</text>

  <!-- X axis labels -->
  <text x="268" y="392" font-family="monospace" font-size="8" fill="#94a3b8">09:41</text>
  <text x="388" y="392" font-family="monospace" font-size="8" fill="#94a3b8">09:42</text>
  <text x="508" y="392" font-family="monospace" font-size="8" fill="#94a3b8">09:43</text>
  <text x="628" y="392" font-family="monospace" font-size="8" fill="#94a3b8">09:44</text>
  <text x="748" y="392" font-family="monospace" font-size="8" fill="#94a3b8">09:45</text>
  <text x="848" y="392" font-family="monospace" font-size="8" fill="#94a3b8">09:46</text>

  <!-- Bottom sync bar -->
  <rect x="252" y="416" width="632" height="40" rx="8" fill="#f8fafc"/>
  <rect x="252" y="416" width="632" height="40" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <text x="268" y="440" font-family="sans-serif" font-size="10" fill="#64748b">⚠️  Violations are written to the smart contract via reportEnvironmentalViolation()</text>
  <rect x="790" y="424" width="82" height="24" rx="6" fill="#0f172a"/>
  <text x="831" y="440" font-family="sans-serif" font-size="9" font-weight="bold" fill="white" text-anchor="middle">⟳ Force Sync</text>

  <text x="450" y="510" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">MEDICORE · IoT Cold-Chain Simulator · /iot</text>
</svg>
