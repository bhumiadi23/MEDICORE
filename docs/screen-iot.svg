<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#00000015"/></filter>
  </defs>

  <rect width="900" height="520" fill="url(#bg)"/>

  <!-- Nav -->
  <rect x="0" y="0" width="900" height="50" fill="white"/>
  <rect x="0" y="49" width="900" height="1" fill="#e2e8f0"/>
  <rect x="24" y="16" width="8" height="8" rx="2" fill="#0e7490"/>
  <rect x="34" y="16" width="8" height="8" rx="2" fill="#0284c7"/>
  <text x="48" y="27" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">MEDICORE</text>

  <!-- IoT header bar -->
  <rect x="0" y="50" width="900" height="44" fill="#0f172a"/>
  <circle cx="30" cy="72" r="5" fill="#22c55e"/>
  <text x="44" y="77" font-family="monospace" font-size="11" fill="#22c55e">● IOT SENSOR SIMULATOR</text>
  <text x="400" y="77" font-family="monospace" font-size="10" fill="#475569">BATCH-DEMO-001  ·  SHP-1234  ·  STREAMING</text>
  <rect x="760" y="60" width="110" height="24" rx="6" fill="#22c55e" opacity="0.15"/>
  <rect x="760" y="60" width="110" height="24" rx="6" fill="none" stroke="#22c55e" stroke-width="1"/>
  <text x="815" y="76" font-family="sans-serif" font-size="9" font-weight="bold" fill="#22c55e" text-anchor="middle">● LIVE STREAM ON</text>

  <!-- Left panel: controls -->
  <rect x="16" y="108" width="220" height="380" rx="12" fill="white" filter="url(#shadow)"/>
  <rect x="16" y="108" width="220" height="380" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <text x="32" y="132" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Device Configuration</text>

  <text x="32" y="158" font-family="sans-serif" font-size="9" font-weight="bold" fill="#94a3b8">DRUG BATCH ID</text>
  <rect x="32" y="163" width="188" height="28" rx="6" fill="#f8fafc"/>
  <rect x="32" y="163" width="188" height="28" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="181" font-family="monospace" font-size="10" fill="#334155">BATCH-DEMO-001</text>

  <text x="32" y="210" font-family="sans-serif" font-size="9" font-weight="bold" fill="#94a3b8">SHIPMENT ID</text>
  <rect x="32" y="215" width="188" height="28" rx="6" fill="#f8fafc"/>
  <rect x="32" y="215" width="188" height="28" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="233" font-family="monospace" font-size="10" fill="#334155">SHP-1234</text>

  <rect x="32" y="256" width="188" height="34" rx="8" fill="#ef4444" opacity="0.1"/>
  <rect x="32" y="256" width="188" height="34" rx="8" fill="none" stroke="#ef4444" stroke-width="1"/>
  <text x="126" y="277" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">■ Stop Data Stream</text>

  <text x="32" y="314" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Trigger Anomalies</text>

  <!-- Anomaly buttons -->
  <rect x="32" y="322" width="188" height="30" rx="6" fill="#fef2f2"/>
  <rect x="32" y="322" width="188" height="30" rx="6" fill="none" stroke="#fecaca" stroke-width="1"/>
  <text x="126" y="341" font-family="sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">🌡️  Inject High Temp (&gt;8°C)</text>

  <rect x="32" y="360" width="188" height="30" rx="6" fill="#eff6ff"/>
  <rect x="32" y="360" width="188" height="30" rx="6" fill="none" stroke="#bfdbfe" stroke-width="1"/>
  <text x="126" y="379" font-family="sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">🌡️  Inject Low Temp (&lt;2°C)</text>

  <rect x="32" y="398" width="188" height="30" rx="6" fill="#fefce8"/>
  <rect x="32" y="398" width="188" height="30" rx="6" fill="none" stroke="#fde68a" stroke-width="1"/>
  <text x="126" y="417" font-family="sans-serif" font-size="10" fill="#d97706" text-anchor="middle">💧  Inject High Humidity</text>

  <!-- Violation alert toast -->
  <rect x="32" y="444" width="188" height="36" rx="8" fill="#fef2f2"/>
  <rect x="32" y="444" width="188" height="36" rx="8" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <text x="126" y="460" font-family="sans-serif" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">⚠️ VIOLATION DETECTED</text>
  <text x="126" y="474" font-family="sans-serif" font-size="8" fill="#ef4444" text-anchor="middle">Drug → QUARANTINED on-chain</text>

