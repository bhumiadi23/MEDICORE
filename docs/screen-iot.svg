  <!-- Temp card -->
  <rect x="252" y="108" width="148" height="80" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="252" y="108" width="148" height="80" rx="10" fill="none" stroke="#e2e8f0" stroke-width="1"/>
