  <rect x="572" y="108" width="312" height="80" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="572" y="108" width="312" height="80" rx="10" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <text x="588" y="128" font-family="sans-serif" font-size="9" fill="#64748b">📍  GPS Location</text>
  <text x="588" y="158" font-family="monospace" font-size="16" font-weight="bold" fill="#0f172a">40.7156, -74.0023</text>
  <text x="588" y="176" font-family="sans-serif" font-size="8" fill="#64748b">New York Metro Area · Last ping 3s ago</text>

  <!-- Chart area -->
  <rect x="252" y="202" width="632" height="200" rx="12" fill="white" filter="url(#shadow)"/>
  <rect x="252" y="202" width="632" height="200" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <text x="268" y="224" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Real-time Temperature Telemetry</text>
  <text x="268" y="238" font-family="sans-serif" font-size="9" fill="#94a3b8">Safe range: 2°C – 8°C  ·  Updating every 3s</text>

  <!-- Chart grid lines -->
  <line x1="268" y1="260" x2="868" y2="260" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="268" y1="280" x2="868" y2="280" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="268" y1="300" x2="868" y2="300" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="268" y1="320" x2="868" y2="320" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="268" y1="340" x2="868" y2="340" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="268" y1="360" x2="868" y2="360" stroke="#f1f5f9" stroke-width="1"/>

