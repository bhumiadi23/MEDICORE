  <text x="268" y="162" font-family="monospace" font-size="30" font-weight="bold" fill="#ef4444">14.2°C</text>
  <text x="268" y="180" font-family="sans-serif" font-size="8" fill="#ef4444">⚠ Above max (8°C)</text>

  <!-- Humidity card -->
  <rect x="412" y="108" width="148" height="80" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="412" y="108" width="148" height="80" rx="10" fill="none" stroke="#e2e8f0" stroke-width="1"/>
